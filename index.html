<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JEWBETS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="container">
      <a href="#"><img src="images/logo.png" alt="JEWBETS Logo" class="logo"></a>
      <nav>
        <a href="#">Home</a>
        <a href="#shop">Shop</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="overlay"></div>
    <!-- Replace "your-image.jpg" with your actual front image -->
    <img src="your-image.jpg" alt="JEWBETS Front Image" class="hero-img">
    <div class="hero-content">
      <h2>JEWBETS Hoodie Version 4.0</h2>
      <button id="buy-hoodie">Shop Now</button>
    </div>
  </section>

  <section id="shop" class="products">
    <div class="container">
      <div class="product">
        <img src="https://via.placeholder.com/300" alt="Hoodie V4.0">
        <h3>JEWBETS Hoodie V4.0</h3>
        <p>$60</p>
        <button>Add to Cart</button>
      </div>
    </div>
  </section>

  <footer id="contact">
    <div class="container">
      <p>© 2025 JEWBETS | Built with ❤️</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
