<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JEWBETS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header with top-left logo and nav -->
  <header>
    <div class="container header-container">
      <!-- Logo -->
      <div class="logo">
        <a href="#"><img src="images/logo.png" alt="JEWBETS Logo" class="header-logo"></a>
      </div>

      <!-- Navigation -->
      <nav class="nav-links">
        <a href="#">Home</a>
        <a href="#shop">Shop</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <!-- Hero Section with centered logo -->
  <section class="hero">
    <div class="overlay"></div>
    <img src="images/logo.png" alt="JEWBETS Logo" class="hero-logo">
    <div class="hero-content">
      <h2>JEWBETS | EST. 2025 | BOULDER CO.</h2>
      <button id="buy-hoodie">Shop Now</button>
    </div>
  </section>

  <!-- Products Section -->
  <section id="shop" class="products">
    <div class="container">
      <div class="product">
        <img src="https://via.placeholder.com/300" alt="Hoodie V4.0">
        <h3>JEWBETS Hoodie V4.0</h3>
        <p>$60</p>
        <button>Add to Cart</button>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer id="contact">
    <div class="container">
      <p>© 2025 JEWBETS | YAT YAS</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
