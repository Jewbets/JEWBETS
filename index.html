<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JEWBETS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header>
    <div class="container header-container">
      <div class="logo">
        <a href="#"><img src="images/logo.png" alt="JEWBETS Logo" class="header-logo"></a>
      </div>
      <nav class="nav-links">
        <a href="#shop">Shop</a>
        <a href="#contact">Contact</a>
        <a href="cart.html" class="cart">Cart (<span id="cart-count">0</span>)</a>
      </nav>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="overlay"></div>
    <div class="hero-container">
      <img src="images/logo.png" alt="JEWBETS Logo" class="hero-logo">
      <h2>JEWBETS | EST. 2026 | BOULDER CO</h2>
    </div>
  </section>

  <!-- Products Section -->
  <section id="shop" class="products">
    <div class="container products-grid">
      <div class="product">
        <img src="images/hoodie.png" alt="JEWBETS Hoodie 1">
        <h3>JEWBETS Hoodie V4.0</h3>
        <p>$60</p>
        <button>Add to Cart</button>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer id="contact">
    <div class="container">
      <p>© 2025 JEWBETS | YAT YAS</p>
    </div>
  </footer>

  <script src="cart.js"></script>
</body>
</html>
