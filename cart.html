<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JEWBETS Cart</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header>
    <div class="container header-container">
      <div class="logo">
        <a href="index.html"><img src="images/logo.png" alt="JEWBETS Logo" class="header-logo"></a>
      </div>
      <nav class="nav-links">
        <a href="index.html">Home</a>
      </nav>
    </div>
  </header>

  <!-- Cart Section -->
  <section class="products">
    <div class="container">
      <h2>Your Cart</h2>
      <div id="cart-items"></div>
      <h3 id="cart-total"></h3>
      <button id="clear-cart">Clear Cart</button>
      <button id="checkout">Checkout</button>
    </div>
  </section>

  <script src="cart.js"></script>
</body>
</html>
