<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEWBETS | Order Confirmed</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .success-page {
      padding: 150px 20px;
      text-align: center;
      background: #f6f6f6;
      min-height: 100vh;
    }
    .success-page h1 {
      font-size: 3em;
      margin-bottom: 20px;
      color: #00cc44;
    }
    .success-page p {
      font-size: 1.2em;
      margin-bottom: 30px;
    }
    .success-page a {
      display: inline-block;
      padding: 12px 30px;
      background: black;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
    .success-page a:hover {
      background: #222;
    }
  </style>
</head>
<body>

  <header>
    <div class="container header-container">
      <div class="logo">
        <a href="index.html"><img src="images/logo.png" alt="JEWBETS Logo" class="header-logo"></a>
      </div>
      <nav class="nav-links">
        <a href="index.html">Home</a>
      </nav>
    </div>
  </header>

  <section class="success-page">
    <h1>Thank You!</h1>
    <p>Your order has been successfully placed. You will receive a confirmation email shortly.</p>
    <a href="index.html">Continue Shopping</a>
  </section>

</body>
</html>
